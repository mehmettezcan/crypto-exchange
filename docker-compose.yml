version: '3.8'

services:
  api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: crypto-exchange-api
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    networks:
      - crypto-network
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: crypto-exchange-react
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - crypto-network
    restart: unless-stopped

networks:
  crypto-network:
    driver: bridge

